      @font-face { font-family: "Liber Grotesque Family"; font-weight: 900; font-display: swap; src: url("/fonts/LiberGrotesqueFamily-ExtBd.woff2") format("woff2"); }
      :root { --bg: #fff7f7; --surface: #fff; --text: #0b0b0b; --muted: #686868; --primary: #e30613; --line: rgba(227, 6, 19, .16); --shell: linear-gradient(180deg, rgba(227, 6, 19, .08) 0%, #fff7f7 18rem); }
      html[data-theme="dark"] { --bg: #121214; --surface: #1d1d20; --text: #f4f4f5; --muted: #b4b7bd; --primary: #cc0f1a; --line: rgba(255, 255, 255, .12); --shell: linear-gradient(180deg, rgba(204, 15, 26, .13) 0%, #121214 18rem); color-scheme: dark; }
      @media (prefers-color-scheme: dark) { html:not([data-theme="light"]) { --bg: #121214; --surface: #1d1d20; --text: #f4f4f5; --muted: #b4b7bd; --primary: #cc0f1a; --line: rgba(255, 255, 255, .12); --shell: linear-gradient(180deg, rgba(204, 15, 26, .13) 0%, #121214 18rem); color-scheme: dark; } }
      * { box-sizing: border-box; }
      body { min-height: 100dvh; margin: 0; color: var(--text); background: var(--shell); font: 16px/1.5 "Liber Grotesque Family", system-ui, sans-serif; }
      a { color: inherit; text-decoration: none; }
      .brand-mark { display: inline-flex; align-items: center; justify-content: center; gap: .18rem; flex-shrink: 0; font-weight: 900; }
      .brand-wordmark { display: inline-grid; align-items: start; }
      .brand-fitxa { color: var(--primary); font-size: clamp(3.1rem, 15vw, 5.6rem); font-weight: 900; line-height: 1; }
      .brand-cae { display: block; margin-left: -.12rem; color: var(--text); font-size: clamp(3.1rem, 15vw, 5.6rem); font-weight: 900; letter-spacing: 0; line-height: 1; }
      main { display: grid; place-items: center; width: min(100%, 40rem); min-height: 100dvh; margin: 0 auto; padding: 2.25rem 1rem; }
      section { display: grid; justify-items: center; gap: .85rem; width: min(100%, 28rem); text-align: center; }
      section .brand-mark { margin-bottom: .55rem; }
      h1 { margin: 0; font-size: clamp(1.7rem, 5vw, 2.35rem); line-height: 1.08; }
      p { max-width: 24rem; margin: 0; color: var(--muted); font-size: .98rem; line-height: 1.35; }
      .actions { display: flex; justify-content: center; flex-wrap: wrap; gap: .6rem; margin-top: .25rem; }
      .button { display: inline-flex; align-items: center; justify-content: center; min-height: 2.65rem; padding: 0 1rem; border-radius: 4px; font-weight: 900; }
      .primary { color: #fff; background: var(--primary); }
      .secondary { border: 1px solid var(--text); color: var(--text); background: var(--surface); }
    </style>
