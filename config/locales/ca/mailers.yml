  employee_welcome_mailer:
    welcome:
      subject: Et donem la benvinguda a %{app_name}
      account_created_text: "S'ha creat un compte amb aquest correu a %{app_name} (%{app_url}): l'eina que hauràs d'utilitzar per dur control del teu registre horari laboral."
      account_created_prefix: S'ha creat un compte amb aquest correu a
      account_created_suffix: l'eina que hauràs d'utilitzar per dur control del teu registre horari laboral.
