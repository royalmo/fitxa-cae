      subject: "[%{app_name}] %{subject}"
      greeting: Hola,
      intro: S'ha rebut un nou missatge des de %{app_name}.
      employee: Treballador
      national_id: DNI/NIE
      email: Correu
      phone: Telèfon
      subject_label: Assumpte
      blank: No informat
