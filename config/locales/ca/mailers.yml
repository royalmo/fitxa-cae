      subject: "[%{app_name}] Compte de responsable creat"
      body: S'ha creat el teu compte de responsable a %{app_name}.
    password_reset:
      subject: "[%{app_name}] Restableix la contrasenya de %{admin_name}"
      body: Hem rebut una sol·licitud per restablir la contrasenya del teu compte de responsable.
      link: Restableix la contrasenya
      button: Canviar contrasenya
      expires: Aquest enllaç caduca d'aquí a 1 hora. Si no has estat tu, pots ignorar aquest missatge.
