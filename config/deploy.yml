# Shared Kamal configuration. Deploy each client with:
#   bin/kamal deploy -d fitxa-cae
#   bin/kamal deploy -d fitxa-xarranca
#
# Destination-specific servers, proxy hosts, clear env, and storage volumes live in:
#   config/deploy.fitxa-cae.yml
#   config/deploy.fitxa-xarranca.yml

# Name of your application. Used to uniquely configure containers.
service: fitxa_cae

# Name of the container image.
image: fitxa_cae

# Always require an explicit destination so we do not accidentally deploy the wrong client.
require_destination: true

# Deploy to these servers.
# Destination-specific host lists live in config/deploy.<destination>.yml.
#
# servers:
#   web:
#   ...

# Enable SSL auto certification via Let's Encrypt and allow for multiple apps on a single web server.
# If used with Cloudflare, set encryption mode in SSL/TLS setting to "Full" to enable CF-to-app encryption.
#
# Using an SSL proxy like this requires turning on config.assume_ssl and config.force_ssl in production.rb.
#
# Do not use this when deploying to multiple web servers; then terminate SSL at your load balancer.
#
proxy:
  ssl: true
  # Destination-specific public hostnames live in config/deploy.<destination>.yml.
  # host: app.example.com
  # Proxy connects to your container on port 80 by default.
  app_port: 80
  forward_headers: true
  healthcheck:
    path: /up

# Where you keep your container images.
registry:
  # localhost makes Kamal start a temporary local Docker registry and forward it over SSH.
  # The image is pushed/pulled through that registry; Kamal does not scp the image.
  #
  # Alternatives: hub.docker.com / registry.digitalocean.com / ghcr.io / ...
  server: localhost:5555

  # Needed for authenticated registries.
  # username: your-user

  # Always use an access token rather than a real password when possible.
  # password:
  #   - KAMAL_REGISTRY_PASSWORD

# Use a different ssh user than root.
ssh:
  user: deploy

# Inject ENV variables into containers (secrets come from .kamal/secrets.<destination>).
env:
  clear:
    # Run the Solid Queue supervisor inside the web server's Puma process.
    # With multiple app servers or heavier background work, split jobs to a dedicated role.
    SOLID_QUEUE_IN_PUMA: true

    # Send real SMS through LabsMobile. Disable per destination only if a client needs dry-run SMS.
    LABSMOBILE_ENABLED: true

    # Puma defaults to 3 request threads and single-process mode.
    # Set WEB_CONCURRENCY only when you want 2 or more Puma worker processes.
    # RAILS_MAX_THREADS: 3
    # WEB_CONCURRENCY: 2

    # Solid Queue defaults to 1 process for each worker group in config/queue.yml.
    # JOB_CONCURRENCY: 2
    # REPORT_JOB_CONCURRENCY: 1

    # Log everything from Rails.
    # RAILS_LOG_LEVEL: debug

  secret:
    - SECRET_KEY_BASE
    - SMTP_USERNAME
    - SMTP_PASSWORD
    - LABSMOBILE_USERNAME
    - LABSMOBILE_API_TOKEN

# Aliases are triggered with "bin/kamal <alias>". You can overwrite arguments on invocation:
# "bin/kamal app logs -r job" will tail logs from the first server in the job section.
aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole --include-password"

# Use a persistent storage volume for SQLite database files and local Active Storage files.
# Destination-specific volume names live in config/deploy.<destination>.yml.
#
# volumes:
#   - "fitxa_cae_storage:/rails/storage"

# Bridge fingerprinted assets, like JS and CSS, between versions to avoid
# hitting 404 on in-flight requests. Combines all files from new and old
# version inside the asset_path.
asset_path: /rails/public/assets

# Configure the image builder.
builder:
  arch: amd64

  # Build image via remote server, useful for faster amd64 builds on arm64 computers.
  # remote: ssh://docker@docker-builder-server
  #
  # Pass arguments and secrets to the Docker build process.
  # args:
  #   RUBY_VERSION: ruby-3.2.1
  # secrets:
  #   - GITHUB_TOKEN

# Configure rolling deploys by setting a wait time between batches of restarts.
#
# boot:
#   limit: 10 # Can also specify as a percentage of total hosts, such as "25%"
#   wait: 2

# Use accessory services (secrets come from .kamal/secrets.<destination>).
#
# accessories:
#   db:
#     image: postgres:17
#     host: 192.168.0.2
#     port: "127.0.0.1:5432:5432"
#     env:
#       secret:
#         - POSTGRES_PASSWORD
#     directories:
#       - data:/var/lib/postgresql/data
#   redis:
#     image: valkey/valkey:8
#     host: 192.168.0.2
#     port: 6379
#     directories:
#       - data:/data
