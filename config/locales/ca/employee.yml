            - title: Obre %{app_name} amb Google Chrome
              caption_html: "<strong>Obre %{app_name} amb Google Chrome</strong> i clica al menú de dalt a la dreta."
            - title: Selecciona l'opció instal·la i crea una drecera
              caption_html: "Selecciona l'opció <strong>instal·la i crea una drecera</strong> (en anglès <em>install and create shortcut</em>)."
